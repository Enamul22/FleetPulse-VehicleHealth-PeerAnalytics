name: FleetPulse verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '17'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip check
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: PYTHONPATH=src python -m fleetpulse.validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleetpulse-verification
          path: |
            test-results.xml
            data/evaluation/validation.json
